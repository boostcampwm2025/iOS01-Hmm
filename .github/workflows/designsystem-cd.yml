name: DesignSystem CD

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy DUDesignSystemExample to TestFlight
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            **/Package.resolved
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Get current version
        id: version
        run: |
          VERSION=$(xcodebuild \
            -workspace SoloDeveloperTraining.xcworkspace \
            -scheme DUDesignSystemExample \
            -showBuildSettings 2>/dev/null \
            | grep '^\s*MARKETING_VERSION' \
            | head -1 \
            | awk '{print $3}')
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if deploy needed
        id: check
        run: |
          LAST_TAG=$(git tag -l 'designsystem-example/*' | sort -V | tail -1)
          LAST_VERSION="${LAST_TAG#designsystem-example/}"
          CURRENT="${{ steps.version.outputs.current }}"
          echo "Last deployed: ${LAST_VERSION:-none}"
          echo "Current: $CURRENT"
          if [ "$CURRENT" = "$LAST_VERSION" ]; then
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "Version unchanged — skipping deploy"
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "Version changed ($LAST_VERSION → $CURRENT) — deploying"
          fi

      - name: Install certificate
        if: steps.check.outputs.deploy == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        if: steps.check.outputs.deploy == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/DUDesignSystemExample.mobileprovision

      - name: Install App Store Connect API key
        if: steps.check.outputs.deploy == 'true'
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" \
            > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Set provisioning profile in project
        if: steps.check.outputs.deploy == 'true'
        env:
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          python3 - << 'PYEOF'
          import re, os
          pbxproj = "SoloDeveloperTraining/SoloDeveloperTraining.xcodeproj/project.pbxproj"
          profile = os.environ["PROFILE_NAME"]
          with open(pbxproj, "r") as f:
              content = f.read()
          # DUDesignSystemExample Release config(088F6A942FCAA7E500E14BA2) 에만 적용
          pattern = r'(088F6A942FCAA7E500E14BA2 /\* Release \*/ = \{.*?PROVISIONING_PROFILE_SPECIFIER = )"[^"]*"'
          content = re.sub(pattern, f'\\1"{profile}"', content, flags=re.DOTALL)
          with open(pbxproj, "w") as f:
              f.write(content)
          PYEOF

      - name: Archive
        if: steps.check.outputs.deploy == 'true'
        run: |
          xcodebuild archive \
            -workspace SoloDeveloperTraining.xcworkspace \
            -scheme DUDesignSystemExample \
            -configuration Release \
            -archivePath build/DUDesignSystemExample.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=QBLK6726G4 \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution"

      - name: Upload to TestFlight
        if: steps.check.outputs.deploy == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.devup.DUDesignSystem</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/DUDesignSystemExample.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Tag deployed version
        if: steps.check.outputs.deploy == 'true'
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "designsystem-example/$VERSION"
          git push origin "designsystem-example/$VERSION"
