name: iOS CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Find latest iOS Simulator
      id: find-simulator
      run: |
        echo "🔍 사용 가능한 시뮬레이터 검색 중..."
        
        # simctl을 사용하여 사용 가능한 iPhone 시뮬레이터 가져오기
        ALL_DEVICES=$(xcrun simctl list devices available | grep "iPhone")
        
        echo "📋 찾은 iPhone 시뮬레이터:"
        echo "$ALL_DEVICES"
        
        # 숫자가 있는 iPhone만 추출하고 번호로 정렬 (iPhone 16, 17, 18... 등)
        # sed로 "iPhone <숫자>" 패턴만 추출하고, 숫자로 정렬하여 가장 큰 것 선택
        NUMBERED_IPHONES=$(echo "$ALL_DEVICES" | grep -E "iPhone [0-9]+" | sed -E 's/.*iPhone ([0-9]+).*/\1/' | sort -n -u)
        LATEST_NUMBER=$(echo "$NUMBERED_IPHONES" | tail -1)
        
        echo "📊 찾은 iPhone 버전: $(echo $NUMBERED_IPHONES | tr '\n' ' ')"
        echo "🎯 최신 버전: iPhone $LATEST_NUMBER"
        
        # 최신 버전의 iPhone을 우선순위로 찾기 (Pro Max > Pro > Plus > 기본)
        SIMULATOR_ID=""
        for MODEL in "iPhone $LATEST_NUMBER Pro Max" "iPhone $LATEST_NUMBER Pro" "iPhone $LATEST_NUMBER Plus" "iPhone $LATEST_NUMBER"; do
          FOUND=$(echo "$ALL_DEVICES" | grep "$MODEL" | tail -1)
          if [ ! -z "$FOUND" ]; then
            echo "✅ '$MODEL' 발견!"
            # UUID 추출
            SIMULATOR_ID=$(echo "$FOUND" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
            SIMULATOR_NAME=$(echo "$FOUND" | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | xargs)
            
            echo "simulator_id=$SIMULATOR_ID" >> $GITHUB_OUTPUT
            echo "simulator_name=$SIMULATOR_NAME" >> $GITHUB_OUTPUT
            echo "✅ 선택된 시뮬레이터: $SIMULATOR_NAME"
            echo "📱 시뮬레이터 ID: $SIMULATOR_ID"
            break
          fi
        done
        
        # 시뮬레이터를 찾지 못한 경우
        if [ -z "$SIMULATOR_ID" ]; then
          echo "❌ 사용 가능한 iPhone 시뮬레이터를 찾을 수 없습니다!"
          echo "📋 전체 시뮬레이터 목록:"
          xcrun simctl list devices available
          exit 1
        fi
        
    - name: Show selected simulator
      run: |
        echo "🎯 사용할 시뮬레이터: ${{ steps.find-simulator.outputs.simulator_name }}"
        echo "🆔 시뮬레이터 ID: ${{ steps.find-simulator.outputs.simulator_id }}"

    - name: Create xcconfig files
      env:
        DEBUG_XCCONFIG: ${{ secrets.DEBUG_XCCONFIG }}
      run: |
        CONFIG_DIR="SoloDeveloperTraining/SoloDeveloperTraining/App/Config"
        mkdir -p "$CONFIG_DIR"

        if [ -z "$DEBUG_XCCONFIG" ]; then
          echo "❌ DEBUG_XCCONFIG secret is missing."
          exit 1
        fi

        printf "%s" "$DEBUG_XCCONFIG" > "$CONFIG_DIR/Debug.xcconfig"
      
    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          **/Package.resolved
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build SoloDeveloperTraining
      run: |
        cd SoloDeveloperTraining
        xcodebuild clean build \
          -project SoloDeveloperTraining.xcodeproj \
          -scheme SoloDeveloperTraining \
          -destination "platform=iOS Simulator,id=${{ steps.find-simulator.outputs.simulator_id }}" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    
    - name: Test SoloDeveloperTraining
      run: |
        cd SoloDeveloperTraining
        xcodebuild test \
          -project SoloDeveloperTraining.xcodeproj \
          -scheme SoloDeveloperTraining \
          -destination "platform=iOS Simulator,id=${{ steps.find-simulator.outputs.simulator_id }}" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          || echo "No tests found or tests failed - continuing..."
    
    - name: Build SoloDeveloperTraining-Dev
      run: |
        cd SoloDeveloperTraining
        xcodebuild clean build \
          -project SoloDeveloperTraining.xcodeproj \
          -scheme SoloDeveloperTraining-Dev \
          -destination "platform=iOS Simulator,id=${{ steps.find-simulator.outputs.simulator_id }}" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    
    - name: Test SoloDeveloperTraining-Dev
      run: |
        cd SoloDeveloperTraining
        xcodebuild test \
          -project SoloDeveloperTraining.xcodeproj \
          -scheme SoloDeveloperTraining-Dev \
          -destination "platform=iOS Simulator,id=${{ steps.find-simulator.outputs.simulator_id }}" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          || echo "No tests found or tests failed - continuing..."
