<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>개발자 키우기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .container { text-align: center; padding: 20px; }
        .button { display: inline-block; padding: 12px 24px; background: #007AFF; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>'개발자 키우기'로 이동합니다.</h3>
        <p>앱이 설치되어 있지 않다면 아래 버튼을 눌러주세요.</p>
        <a id="appstore-button" href="https://apps.apple.com/kr/app/%EA%B0%9C%EB%B0%9C%EC%9E%90-%ED%82%A4%EC%9A%B0%EA%B8%B0/id6758282441" class="button">App Store에서 열기</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const endingId = urlParams.get('id');

        // 유니버셜 링크가 동작하지 않거나, 앱이 미설치된 경우 처리
        window.location.href = "devup://";

        // 1초 후에도 페이지에 머물러 있다면 앱스토어로 이동
        setTimeout(function() {
            window.location.href = "https://apps.apple.com/kr/app/%EA%B0%9C%EB%B0%9C%EC%9E%90-%ED%82%A4%EC%9A%B0%EA%B8%B0/id6758282441";
        }, 1000);
    </script>
</body>
</html>
